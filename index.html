<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download Deutsches Picolo</title>
    <script>
        // Erkennt das Betriebssystem
        var userAgent = navigator.userAgent || navigator.vendor || window.opera;

        // 1. Wenn es ein iPhone/iPad ist -> Ab zum Apple App Store
        if (/iPad|iPhone|iPod/.test(userAgent) && !window.MSStream) {
            window.location.replace("https://apps.apple.com/de/app/yono-das-ehrliche-partyspiel/id6761210694");
        }
        // 2. Wenn es ein Android ist -> Ab zum Google Play Store
        else if (/android/i.test(userAgent)) {
            window.location.replace("https://play.google.com/store/apps/details?id=com.alexl.tacheles");
        }
        // 3. Fallback (Wenn jemand am PC scannt) -> Zurück zu einer Webseite oder Linktree
        else {
            window.location.replace("https://apps.apple.com/de/app/yono-das-ehrliche-partyspiel/id6761210694"); 
        }
    </script>
</head>
<body style="background-color: #1a1a1a; color: #fff; font-family: sans-serif; text-align: center; padding-top: 20%;">
    <h2>Leite zum App Store weiter... 🚀</h2>
</body>
</html>
